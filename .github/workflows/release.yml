name: Release

# On a version tag (v0.1.0, …): test, build the Claude Desktop extension (.mcpb) and
# attach it to a GitHub Release. The Claude Code plugin needs no build here: it runs
# the committed plugin/server/index.mjs, and users get it from the tagged commit.
# Publishes to npm too, but only when an NPM_TOKEN repository secret exists. Run
# `npm run smoke` and `npm run gen-allowlist` by hand before tagging; CI never
# contacts PCGamingWiki.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json, manifest.json and the plugin
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          test "v$(node -p 'require("./manifest.json").version')" = "$GITHUB_REF_NAME"
          test "v$(node -p 'require("./plugin/.claude-plugin/plugin.json").version')" = "$GITHUB_REF_NAME"
      - name: Check the committed plugin bundle is up to date
        run: npm run bundle && git diff --exit-code -- plugin/
      - run: npm run typecheck
      - run: npm test

  desktop-extension:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:mcpb
      - name: Create the GitHub Release with the .mcpb attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.mcpb --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip without an NPM_TOKEN secret
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "No NPM_TOKEN secret; not publishing to npm."
      - uses: actions/checkout@v4
        if: env.NODE_AUTH_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NODE_AUTH_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - if: env.NODE_AUTH_TOKEN != ''
        run: npm ci
      - if: env.NODE_AUTH_TOKEN != ''
        run: npm run build
      - if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
