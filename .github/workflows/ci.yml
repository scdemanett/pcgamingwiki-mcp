name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Tests use recorded fixtures only; CI never contacts PCGamingWiki.
      - run: npm test
      - run: npm run build
      # The plugin runs the committed bundle, so it must match the source.
      - if: matrix.node == 22
        name: Check plugin/server/index.mjs is up to date (run npm run bundle)
        run: npm run bundle && git diff --exit-code -- plugin/
      # Catches manifest or packing problems before a release tag.
      - if: matrix.node == 22
        run: npm run pack:mcpb
